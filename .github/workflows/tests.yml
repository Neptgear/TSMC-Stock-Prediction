name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m py_compile data_fetch.py data_quality.py ta_features.py tft_model.py train_transformer.py scripts/audit_saved_run.py scripts/asof_backtest.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

